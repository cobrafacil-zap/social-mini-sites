/* ---- shim de armazenamento local (funciona fora do Claude, via localStorage) ---- */
if (!window.storage) {
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      if (v === null) throw new Error("not found");
      return { key, value: v };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys };
    },
  };
}

/* ============================================================
   STORAGE HELPERS
   ============================================================ */

async function safeGet(key, fallback) {
  try {
    const res = await window.storage.get(key, false);
    return res ? JSON.parse(res.value) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function safeSet(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch (e) {
    console.error("storage set failed", e);
  }
}
async function safeDelete(key) {
  try {
    await window.storage.delete(key, false);
  } catch (e) {
    /* ignore */
  }
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function sumRange(daily, field, days) {
  let total = 0;
  const now = new Date();
  for (let i = 0; i < days; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    if (daily[key]) total += daily[key][field] || 0;
  }
  return total;
}
function sumAll(daily, field) {
  return Object.values(daily).reduce((acc, d) => acc + (d[field] || 0), 0);
}

async function loadStats(id) {
  return safeGet(`stats:${id}`, { daily: {} });
}
async function recordEvent(id, field) {
  const stats = await loadStats(id);
  const t = todayStr();
  if (!stats.daily[t]) {
    stats.daily[t] = { views: 0, whatsapp: 0, instagram: 0, comoChegar: 0, telefone: 0, outro: 0 };
  }
  stats.daily[t][field] = (stats.daily[t][field] || 0) + 1;
  await safeSet(`stats:${id}`, stats);
  return stats;
}

function slugify(str) {
  return (str || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}

function radiusFor(style) {
  if (style === "pill") return 999;
  if (style === "square") return 4;
  return 14;
}

function fullAddress(loc) {
  return [loc.address, loc.number, loc.neighborhood, loc.city, loc.state, loc.zip].filter(Boolean).join(", ");
}
function mapsLink(loc) {
  const q = loc.mapsQuery || fullAddress(loc);
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
}
function mapsEmbed(loc) {
  const q = loc.mapsQuery || fullAddress(loc);
  return `https://maps.google.com/maps?q=${encodeURIComponent(q)}&output=embed`;
}
function waLink(whatsapp, message) {
  const digits = (whatsapp || "").replace(/\D/g, "");
  return `https://wa.me/${digits}?text=${encodeURIComponent(message || "")}`;
}
function externalUrl(v) {
  if (!v) return "";
  if (v.startsWith("http")) return v;
  return `https://${v}`;
}
function instaUrl(v) {
  if (!v) return "";
  if (v.startsWith("http")) return v;
  return `https://instagram.com/${v.replace(/^@/, "")}`;
}

function isOpenNow(hours, now) {
  const jsDay = now.getDay(); // 0 sun .. 6 sat
  const idx = (jsDay + 6) % 7; // 0 mon .. 6 sun
  const dayKey = DAYS[idx].key;
  const today = hours[dayKey];
  if (!today || today.closed) return false;
  const cur = now.getHours() * 60 + now.getMinutes();
  const [oh, om] = (today.open || "00:00").split(":").map(Number);
  const [ch, cm] = (today.close || "00:00").split(":").map(Number);
  const openMin = oh * 60 + om;
  const closeMin = ch * 60 + cm;
  return cur >= openMin && cur <= closeMin;
}

function Editor({ siteId, onBack, onDataChanged }) {
  const [site, setSite] = useState(null);
  const [step, setStep] = useState(0);
  const [saved, setSaved] = useState(true);
  const [published, setPublished] = useState(false);
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      const s = await safeGet(`site:${siteId}`, null);
      setSite(s);
    })();
  }, [siteId]);

  const set = useCallback((path, value) => {
    setSite((prev) => {
      const next = _.cloneDeep(prev);
      _.set(next, path, value);
      next.updatedAt = Date.now();
      return next;
    });
    setSaved(false);
  }, []);

  useEffect(() => {
    if (!site) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      await safeSet(`site:${site.id}`, site);
      const idx = await safeGet("sites-index", []);
      const pos = idx.findIndex((i) => i.id === site.id);
      const summary = { id: site.id, slug: site.slug, name: site.company.name, status: site.status, template: site.template, updatedAt: site.updatedAt };
      if (pos >= 0) idx[pos] = summary; else idx.push(summary);
      await safeSet("sites-index", idx);
      setSaved(true);
      onDataChanged();
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [site]);

  if (!site) return <div style={{ padding: 40, fontFamily: "'Inter', sans-serif" }}>Carregando…</div>;

  const publicUrl = `https://socialminisites.app/${site.slug}`;

  const publish = () => {
    set("status", "published");
    setPublished(true);
  };

  return (
    <div style={{ minHeight: "100vh", background: "#F6F6F2", fontFamily: "'Inter', sans-serif" }}>
      <div style={{ background: "#fff", borderBottom: "1px solid #E7E6E1", padding: "14px 24px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 30 }}>
        <button onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5, color: "#3A3D38", background: "transparent", border: "none", cursor: "pointer" }}>
          <ArrowLeft size={15} /> Voltar
        </button>
        <div style={{ fontSize: 13, color: "#8B8B85" }}>{saved ? "Salvo" : "Salvando…"}</div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <StatusBadge status={site.status} />
          <button onClick={publish} style={{ background: "#145C4B", color: "#fff", border: "none", borderRadius: 9, padding: "8px 15px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            Publicar mini site
          </button>
        </div>
      </div>

      {published && (
        <PublishSuccess
          site={site}
          publicUrl={publicUrl}
          onClose={() => setPublished(false)}
          onView={() => { window.location.hash = `#/s/${site.slug}`; }}
        />
      )}

      <div style={{ display: "grid", gridTemplateColumns: "300px 1fr 400px", gap: 0, alignItems: "start" }}>
        {/* STEPS NAV */}
        <div style={{ padding: "20px 16px", borderRight: "1px solid #E7E6E1", position: "sticky", top: 57 }}>
          {STEPS.map((s, i) => (
            <button
              key={s.key}
              onClick={() => setStep(i)}
              style={{
                display: "block", width: "100%", textAlign: "left", padding: "10px 12px", borderRadius: 8, marginBottom: 3,
                background: step === i ? "#EAF1EE" : "transparent", color: step === i ? "#145C4B" : "#3A3D38",
                fontWeight: step === i ? 600 : 500, fontSize: 13.5, border: "none", cursor: "pointer",
              }}
            >
              {i + 1}. {s.label}
            </button>
          ))}
        </div>

        {/* FORM */}
        <div style={{ padding: "24px 32px", maxWidth: 620 }}>
          <EditorStep step={STEPS[step].key} site={site} set={set} />
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 24 }}>
            <button disabled={step === 0} onClick={() => setStep(step - 1)} style={{ ...navBtn, opacity: step === 0 ? 0.35 : 1 }}>
              <ChevronLeft size={15} /> Anterior
            </button>
            <button disabled={step === STEPS.length - 1} onClick={() => setStep(step + 1)} style={{ ...navBtn, opacity: step === STEPS.length - 1 ? 0.35 : 1 }}>
              Próximo <ChevronRight size={15} />
            </button>
          </div>
        </div>

        {/* PREVIEW */}
        <div style={{ padding: "24px 20px", position: "sticky", top: 57 }}>
          <p style={{ fontSize: 12.5, color: "#8B8B85", marginBottom: 10, textAlign: "center" }}>Pré-visualização em tempo real</p>
          <div style={{ width: 340, height: 640, margin: "0 auto", borderRadius: 34, border: "9px solid #181A17", overflow: "hidden", position: "relative", background: "#000" }}>
            <div style={{ position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)", width: 110, height: 18, background: "#181A17", borderRadius: "0 0 12px 12px", zIndex: 5 }} />
            <div style={{ width: "100%", height: "100%", overflowY: "auto" }}>
              <MiniSitePublic site={site} interactive={false} onEvent={() => {}} />
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

      </div>
    </div>
  );

        const h = site.hours[d.key];
        return (
          <div key={d.key} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid #EFEEE9" }}>
            <span style={{ width: 90, fontSize: 13.5, fontWeight: 500, color: "#3A3D38" }}>{d.label}</span>
            {!h.closed ? (
              <>
                <input type="time" value={h.open} onChange={(e) => set(`hours.${d.key}.open`, e.target.value)} className={inputCls} style={{ width: 120 }} />
                <span style={{ color: "#8B8B85", fontSize: 12 }}>até</span>
                <input type="time" value={h.close} onChange={(e) => set(`hours.${d.key}.close`, e.target.value)} className={inputCls} style={{ width: 120 }} />
              </>
            ) : (
              <span style={{ fontSize: 13, color: "#8B8B85", flex: 1 }}>Fechado</span>
            )}
            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "#767671", marginLeft: "auto" }}>
              <input type="checkbox" checked={h.closed} onChange={(e) => set(`hours.${d.key}.closed`, e.target.checked)} /> Fechado
            </label>
          </div>
        );
      })}
    </div>
  );
}

function StepGaleria({ site, set }) {
  const [url, setUrl] = useState("");
  const add = () => {
    if (!url.trim()) return;
    set("gallery", [...site.gallery, { id: `img_${Date.now()}`, url: url.trim() }]);
    setUrl("");
  };
  const remove = (id) => set("gallery", site.gallery.filter((g) => g.id !== id));
  return (
    <div>
      <h2 style={sectionTitle}>Galeria de fotos</h2>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <input className={inputCls} value={url} onChange={(e) => setUrl(e.target.value)} placeholder="Cole a URL de uma imagem" onKeyDown={(e) => e.key === "Enter" && add()} />
        <button onClick={add} style={{ ...navBtn, background: "#145C4B", color: "#fff", borderColor: "#145C4B" }}><Plus size={14} /> Adicionar</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
        {site.gallery.map((g) => (
          <div key={g.id} style={{ position: "relative" }}>
            <img src={g.url} alt="" style={{ width: "100%", height: 100, objectFit: "cover", borderRadius: 10 }} />
            <button onClick={() => remove(g.id)} style={{ position: "absolute", top: 5, right: 5, background: "rgba(0,0,0,0.6)", border: "none", borderRadius: 999, width: 22, height: 22, color: "#fff", cursor: "pointer" }}>
              <X size={12} />
            </button>
          </div>
        ))}
      </div>
      {site.gallery.length === 0 && <p style={{ fontSize: 13, color: "#8B8B85" }}>Nenhuma foto adicionada ainda.</p>}
    </div>
  );
}

function StepBotoes({ site, set }) {
  const update = (id, field, value) => set("buttons", site.buttons.map((b) => (b.id === id ? { ...b, [field]: value } : b)));
  const add = () => set("buttons", [...site.buttons, { id: `btn_${Date.now()}`, name: "", icon: "star", link: "", order: site.buttons.length }]);
  const remove = (id) => set("buttons", site.buttons.filter((b) => b.id !== id));
  const move = (id, dir) => {
    const arr = _.sortBy(site.buttons, "order");
    const i = arr.findIndex((b) => b.id === id);
    const j = i + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[i].order, arr[j].order] = [arr[j].order, arr[i].order];
    set("buttons", arr);
  };
  return (
    <div>
      <h2 style={sectionTitle}>Botões comerciais</h2>
      <p style={{ fontSize: 13, color: "#767671", marginBottom: 14 }}>Ex: Solicitar orçamento, Ver cardápio, Fazer pedido, Agendar horário…</p>
      {_.sortBy(site.buttons, "order").map((b, i) => (
        <div key={b.id} style={{ border: "1px solid #E7E6E1", borderRadius: 10, padding: 12, marginBottom: 10 }}>
          <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 2fr auto", gap: 8, alignItems: "center" }}>
            <input className={inputCls} value={b.name} onChange={(e) => update(b.id, "name", e.target.value)} placeholder="Nome do botão" />
            <select className={inputCls} value={b.icon} onChange={(e) => update(b.id, "icon", e.target.value)}>
              {ICON_OPTIONS.map((k) => <option key={k} value={k}>{k}</option>)}
            </select>
            <input className={inputCls} value={b.link} onChange={(e) => update(b.id, "link", e.target.value)} placeholder="Link (https://...)" />
            <div style={{ display: "flex", gap: 4 }}>
              <button onClick={() => move(b.id, -1)} style={iconBtnStyle}><ChevronLeft size={13} style={{ transform: "rotate(90deg)" }} /></button>
              <button onClick={() => move(b.id, 1)} style={iconBtnStyle}><ChevronLeft size={13} style={{ transform: "rotate(-90deg)" }} /></button>
              <button onClick={() => remove(b.id)} style={{ ...iconBtnStyle, color: "#9C3B31" }}><Trash2 size={13} /></button>
            </div>
          </div>
        </div>
      ))}
      <button onClick={add} style={navBtn}><Plus size={14} /> Adicionar botão</button>
    </div>
  );
}

function StepWhatsapp({ site, set }) {
  const c = site.company;
  return (
    <div>
      <h2 style={sectionTitle}>WhatsApp</h2>
      <Field label="Número do WhatsApp"><input className={inputCls} value={c.whatsapp} onChange={(e) => set("company.whatsapp", e.target.value)} placeholder="55 43 90000-0000" /></Field>
      <Field label="Mensagem automática" hint="Enviada quando o cliente clicar no botão do WhatsApp">
        <textarea className={inputCls} rows={3} value={c.whatsappMessage} onChange={(e) => set("company.whatsappMessage", e.target.value)} />
      </Field>
      <div style={{ background: "#F1F5F2", borderRadius: 10, padding: 12, fontSize: 12.5, color: "#3A3D38" }}>
        Link gerado: <span style={{ color: "#145C4B", wordBreak: "break-all" }}>{waLink(c.whatsapp, c.whatsappMessage)}</span>
      </div>
    </div>
  );
}

function StepEstilo({ site, set }) {
  const c = site.customization;
  const colorField = (label, key) => (
    <Field label={label}>
      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
        <input type="color" value={c[key]} onChange={(e) => set(`customization.${key}`, e.target.value)} style={{ width: 42, height: 36, border: "1px solid #DDDBD4", borderRadius: 8, padding: 2 }} />
        <input className={inputCls} value={c[key]} onChange={(e) => set(`customization.${key}`, e.target.value)} />
      </div>
    </Field>
  );
  return (
    <div>
      <h2 style={sectionTitle}>Personalização visual</h2>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        {colorField("Cor principal", "primary")}
        {colorField("Cor secundária", "secondary")}
        {colorField("Cor do fundo", "background")}
        {colorField("Cor dos textos", "text")}
      </div>
      <Field label="Estilo dos botões">
        <div style={{ display: "flex", gap: 8 }}>
          {["rounded", "pill", "square"].map((s) => (
            <button
              key={s}
              onClick={() => set("customization.buttonStyle", s)}
              style={{ flex: 1, padding: "10px", borderRadius: radiusFor(s) > 20 ? 999 : radiusFor(s), border: c.buttonStyle === s ? "2px solid #145C4B" : "1px solid #DDDBD4", background: c.buttonStyle === s ? "#EAF1EE" : "#fff", fontSize: 13, cursor: "pointer" }}
            >
              {s === "rounded" ? "Arredondado" : s === "pill" ? "Pílula" : "Quadrado"}
            </button>
          ))}
        </div>
      </Field>
    </div>
  );
}

const sectionTitle = { fontSize: 17, fontWeight: 600, color: "#181A17", marginBottom: 18 };

/* ============================================================
   PÁGINA DE ESTATÍSTICAS
   ============================================================ */

function StatsPage({ siteId, onBack }) {
  const [site, setSite] = useState(null);
  const [stats, setStats] = useState(null);

  useEffect(() => {
    (async () => {
      setSite(await safeGet(`site:${siteId}`, null));
      setStats(await safeGet(`stats:${siteId}`, { daily: {} }));
    })();
  }, [siteId]);

  if (!site || !stats) return <div style={{ padding: 40, fontFamily: "'Inter', sans-serif" }}>Carregando…</div>;

  const metrics = [
    { key: "views", label: "Visualizações", icon: Eye },
    { key: "whatsapp", label: "Cliques no WhatsApp", icon: MessageCircle },
    { key: "instagram", label: "Cliques no Instagram", icon: Instagram },
    { key: "comoChegar", label: 'Cliques em "Como chegar"', icon: MapPin },
    { key: "telefone", label: "Cliques em telefone", icon: Phone },
    { key: "outro", label: "Cliques em outros botões", icon: MousePointerClick },
  ];
  const ranges = [
    { label: "Hoje", days: 1 },
    { label: "Últimos 7 dias", days: 7 },
    { label: "Últimos 30 dias", days: 30 },
  ];

  return (
    <div style={{ minHeight: "100vh", background: "#F6F6F2", fontFamily: "'Inter', sans-serif" }}>
      <div style={{ maxWidth: 900, margin: "0 auto", padding: "28px 24px 60px" }}>
        <button onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5, color: "#3A3D38", background: "transparent", border: "none", cursor: "pointer", marginBottom: 18 }}>
          <ArrowLeft size={15} /> Voltar ao painel
        </button>
        <h1 style={{ fontSize: 19, fontWeight: 600, color: "#181A17", marginBottom: 2 }}>{site.company.name || "(sem nome)"}</h1>
        <p style={{ fontSize: 13, color: "#8B8B85", marginBottom: 22 }}>/{site.slug}</p>

        <div style={{ background: "#fff", border: "1px solid #E7E6E1", borderRadius: 12, overflow: "hidden" }}>
          <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr", padding: "12px 18px", background: "#FAFAF7", fontSize: 12.5, fontWeight: 600, color: "#767671" }}>
            <span>Métrica</span>
            {ranges.map((r) => <span key={r.label} style={{ textAlign: "right" }}>{r.label}</span>)}
          </div>
          {metrics.map((m, i) => (
            <div key={m.key} style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr", padding: "13px 18px", borderTop: "1px solid #EFEEE9", alignItems: "center" }}>
              <span style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13.5, color: "#181A17" }}><m.icon size={15} color="#145C4B" /> {m.label}</span>
              {ranges.map((r) => (
                <span key={r.label} style={{ textAlign: "right", fontSize: 14, fontWeight: 600, color: "#181A17" }}>{sumRange(stats.daily, m.key, r.days)}</span>
              ))}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP RAIZ
   ============================================================ */

const FONT_IMPORT = `@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');`;

function App() {
  const [route, setRoute] = useState(window.location.hash || "#/");
  const [authed, setAuthed] = useState(false);
  const [checkedAuth, setCheckedAuth] = useState(false);
  const [index, setIndex] = useState([]);
  const [statsMap, setStatsMap] = useState({});

  useEffect(() => {
    const onHash = () => setRoute(window.location.hash || "#/");
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffect(() => {
    (async () => {
      const a = await safeGet("auth", false);
      setAuthed(!!a);
      setCheckedAuth(true);
    })();
  }, []);

  const refreshIndex = useCallback(async () => {
    const idx = await safeGet("sites-index", []);
    setIndex(idx);
    const sm = {};
    for (const s of idx) sm[s.id] = await loadStats(s.id);
    setStatsMap(sm);
  }, []);

  useEffect(() => { refreshIndex(); }, [refreshIndex]);

  const navigate = (h) => { window.location.hash = h; };

  const handleLogin = async () => { await safeSet("auth", true); setAuthed(true); navigate("#/admin"); };
  const handleLogout = async () => { await safeSet("auth", false); setAuthed(false); navigate("#/"); };

  const handleCreate = async (template) => {
    const site = newSite(template);
    await safeSet(`site:${site.id}`, site);
    const idx = await safeGet("sites-index", []);
    idx.push({ id: site.id, slug: site.slug, name: site.company.name, status: site.status, template: site.template, updatedAt: site.updatedAt });
    await safeSet("sites-index", idx);
    await refreshIndex();
    navigate(`#/admin/edit/${site.id}`);
  };

  const handleDelete = async (id) => {
    await safeDelete(`site:${id}`);
    await safeDelete(`stats:${id}`);
    const idx = await safeGet("sites-index", []);
    await safeSet("sites-index", idx.filter((s) => s.id !== id));
    await refreshIndex();
    navigate("#/admin");
  };

  // roteamento simples
  const m = (pattern) => route.match(pattern);

  let content;
  const publicMatch = m(/^#\/s\/(.+)$/);

  if (publicMatch) {
    content = <PublicSiteView slug={publicMatch[1]} onBack={() => navigate("#/admin")} />;
  } else if (!checkedAuth) {
    content = <div style={{ minHeight: "100vh" }} />;
  } else if (!authed) {
    content = <LoginScreen onLogin={handleLogin} />;
  } else {
    const editMatch = m(/^#\/admin\/edit\/(.+)$/);
    const statsMatch = m(/^#\/admin\/stats\/(.+)$/);
    const deleteMatch = m(/^#\/admin\/delete\/(.+)$/);
    if (editMatch) {
      content = <Editor siteId={editMatch[1]} onBack={() => { navigate("#/admin"); refreshIndex(); }} onDataChanged={refreshIndex} />;
    } else if (statsMatch) {
      content = <StatsPage siteId={statsMatch[1]} onBack={() => navigate("#/admin")} />;
    } else if (deleteMatch) {
      content = <ConfirmDelete siteId={deleteMatch[1]} index={index} onCancel={() => navigate("#/admin")} onConfirm={() => handleDelete(deleteMatch[1])} />;
    } else {
      content = <Dashboard index={index} statsMap={statsMap} onCreatePick={handleCreate} onNavigate={navigate} onLogout={handleLogout} />;
    }
  }

  return (
    <>
      <style>{FONT_IMPORT}</style>
      {content}
    </>
  );
}

function ConfirmDelete({ siteId, index, onCancel, onConfirm }) {
  const s = index.find((i) => i.id === siteId);
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(20,20,18,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, fontFamily: "'Inter', sans-serif" }}>
      <div style={{ background: "#fff", borderRadius: 16, padding: 26, width: 360 }}>
        <h3 style={{ fontSize: 15.5, fontWeight: 600, color: "#181A17", marginBottom: 8 }}>Excluir mini site?</h3>
        <p style={{ fontSize: 13, color: "#767671", marginBottom: 20 }}>
          Isso removerá permanentemente "{s?.name || s?.slug}" e todas as suas estatísticas.
        </p>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={onCancel} style={{ ...navBtn, flex: 1, justifyContent: "center" }}>Cancelar</button>
          <button onClick={onConfirm} style={{ flex: 1, background: "#9C3B31", color: "#fff", border: "none", borderRadius: 9, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Excluir</button>
        </div>
      </div>
    </div>
  );
}

function PublicSiteView({ slug, onBack }) {
  const [site, setSite] = useState(undefined);
  const recorded = useRef(false);

  useEffect(() => {
    (async () => {
      const idx = await safeGet("sites-index", []);
      const summary = idx.find((s) => s.slug === slug);
      if (!summary) { setSite(null); return; }
      const full = await safeGet(`site:${summary.id}`, null);
      setSite(full);
      if (full && full.status === "published" && !recorded.current) {
        recorded.current = true;
        recordEvent(full.id, "views");
      }
    })();
  }, [slug]);

  const handleEvent = (field) => {
    if (site) recordEvent(site.id, field);
  };

  if (site === undefined) return <div style={{ minHeight: "100vh" }} />;
  if (!site || site.status !== "published") {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 12, fontFamily: "'Inter', sans-serif" }}>
        <p style={{ fontSize: 15, color: "#3A3D38" }}>Este mini site não está disponível.</p>
        <button onClick={onBack} style={navBtn}>Voltar ao painel</button>
      </div>
    );
  }

  return <MiniSitePublic site={site} interactive={true} onEvent={handleEvent} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
